<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Плакат — Наш "В" класс</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Unbounded',sans-serif;background:#0f1220;display:flex;justify-content:center;padding:20px}
.poster{
  width:210mm;height:297mm;background:#f5f5f7;padding:16mm 14mm;position:relative;overflow:hidden;
  display:flex;flex-direction:column;color:#111118;
}
/* фоновые цветовые пятна */
.poster::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse at top right,rgba(124,92,224,0.14) 0%,transparent 55%),
  radial-gradient(ellipse at bottom left,rgba(217,70,168,0.12) 0%,transparent 55%);pointer-events:none}
.inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.head{text-align:center;padding-bottom:8mm}
.logo{font-size:6.5mm;font-weight:800;background:linear-gradient(90deg,#7c5ce0,#d946a8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5mm}
h1{font-size:13mm;font-weight:900;line-height:1.1;margin-top:3mm;background:linear-gradient(135deg,#7c5ce0 0%,#d946a8 60%,#d4990a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5mm}
.sub{font-size:3.8mm;color:#6b6b80;margin-top:3mm;font-weight:300}
.deliver{text-align:center;color:#111118;font-size:3.6mm;margin:6mm 0 2mm;font-weight:400}
.hint{text-align:center;color:#111118;font-size:4.5mm;font-weight:700;margin-top:8mm}
.cards{flex:1;display:flex;gap:8mm;align-items:stretch;margin-top:8mm}
.card{flex:1;background:#ffffff;border:1px solid #dddde5;border-radius:8mm;box-shadow:0 5mm 12mm rgba(20,20,60,.12);padding:7mm 6mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.icon{width:22mm;height:22mm;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:5mm;flex-shrink:0}
.icon svg{display:block}
.c-title{font-size:5.5mm;font-weight:800;color:#111118;line-height:1.2}
.c-desc{font-size:3mm;color:#6b6b80;margin-top:2mm;font-weight:300}
.qr{margin-top:5mm;width:70mm;height:70mm;object-fit:contain;background:#fff;border-radius:3mm;padding:2mm;box-shadow:0 2mm 6mm rgba(20,20,60,.10)}
.c-link{font-size:2.6mm;color:#7c5ce0;margin-top:4mm;word-break:break-all;font-weight:400}
.tg .icon{background:linear-gradient(135deg,#2aabee,#229ed9);color:#fff}
.site .icon{background:linear-gradient(135deg,#7c5ce0,#d946a8);color:#fff}
.foot{text-align:center;color:#111118;font-size:3mm;margin-top:6mm;font-weight:400;opacity:.85}
.foot b{color:#111118}
@media print{
  body{background:#fff;padding:0}
  .poster{background:#f5f5f7;box-shadow:none}
  .poster::before{display:block !important}
  .cards{page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="poster">
  <div class="inner">
    <div class="head">
      <div class="logo">ШКОЛА №160 · УГЛУБЛЁННОЕ ИЗУЧЕНИЕ АНГЛИЙСКОГО</div>
      <h1>Наш "В" класс</h1>
    </div>

    <div class="deliver">Отсканируй QR-код или нажми на него, чтобы перейти</div>

    <div class="hint">👇 Присоединяйся 👇</div>

    <div class="cards">
      <div class="card tg">
        <div class="icon tg">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff" aria-hidden="true"><path d="M9.04 15.2l-.38 3.35c.47 0 .68-.2.93-.45l2.23-2.06 4.63 3.33c.85.46 1.45.22 1.68-.77L21.7 4.7c.28-1.24-.46-1.72-1.28-1.42L2.84 9.5c-1.22.47-1.2 1.16-.22 1.46l3.95 1.22L17.5 6.5c.5-.3.96-.13.58.18L9.04 15.2z"/></svg>
        </div>
        <div class="c-title">Телеграм<br>группа</div>
        <div class="c-desc">общение и новости класса</div>
        <img class="qr" src="img/qr-tg.png" alt="QR на Telegram">
        <div class="c-link">t.me/+OjLQkaIZ8Y03YmRi</div>
      </div>

      <div class="card site">
        <div class="icon site">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-3.2a15.3 15.3 0 00-1.3-3.4A8 8 0 0118.9 8zM12 4.1c.7 1.2 1.3 2.5 1.7 3.9h-3.4c.4-1.4 1-2.7 1.7-3.9zM4.3 14a8 8 0 01-.3-2 8 8 0 01.3-2h3.3a16 16 0 000 4H4.3zm1.3 2h3.2c.3 1.2.7 2.4 1.3 3.4A8 8 0 015.6 16zm3.2-8H5.6a8 8 0 014.5-3.4A15.3 15.3 0 008.8 8zM12 19.9c-.7-1.2-1.3-2.5-1.7-3.9h3.4c-.4 1.4-1 2.7-1.7 3.9zM13.7 14h-3.4a14 14 0 010-4h3.4a14 14 0 010 4zm.8 5.4c.6-1 1.1-2.2 1.3-3.4h3.2a8 8 0 01-4.5 3.4zm1.8-5.4a16 16 0 000-4h3.4a8 8 0 010 4h-3.4z"/></svg>
        </div>
        <div class="c-title">Наш<br>сайт</div>
        <div class="c-desc">учителя, галерея и фото</div>
        <img class="qr" src="img/qr-site.png" alt="QR на сайт">
        <div class="c-link">doinwor.github.io/class-site</div>
      </div>
    </div>

    <div class="foot">Сделано с ❤️ для нашего класса</div>
  </div>
</div>
</body>
</html>
